<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 170" width="1600" height="170" preserveAspectRatio="xMidYMax slice">
  <!-- Original drawing: mine stores yard at sunrise, for the page header. No photos, no real MCL material. -->
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD08A"/>
      <stop offset="1" stop-color="#F08A4B"/>
    </linearGradient>
  </defs>
  <!-- distant overburden dumps -->
  <path d="M0 118 L160 92 L330 108 L520 84 L700 104 L900 88 L1100 106 L1300 86 L1480 100 L1600 92 V170 H0 Z" fill="#7A4868" opacity="0.65"/>
  <!-- sawtooth warehouse -->
  <path d="M60 170 V96 L110 76 V96 L160 76 V96 L210 76 V96 L260 76 V96 L310 76 V96 L360 76 V96 L410 76 V96 L460 76 V170 Z" fill="#2B2140"/>
  <g fill="url(#lit)">
    <rect x="80" y="128" width="46" height="42"/>
    <rect x="150" y="136" width="46" height="34"/>
    <rect x="220" y="124" width="46" height="46"/>
    <rect x="290" y="140" width="46" height="30"/>
  </g>
  <rect x="80" y="108" width="370" height="5" fill="#FFB772" opacity="0.85"/>
  <rect x="360" y="122" width="90" height="48" fill="#33274A"/>
  <g fill="#FFC27A" opacity="0.9">
    <rect x="372" y="132" width="16" height="10"/>
    <rect x="398" y="132" width="16" height="10"/>
    <rect x="424" y="132" width="16" height="10"/>
  </g>
  <!-- tyre stack -->
  <g fill="none" stroke="#2B2140" stroke-width="7">
    <ellipse cx="520" cy="162" rx="20" ry="6"/>
    <ellipse cx="520" cy="150" rx="20" ry="6"/>
    <ellipse cx="520" cy="138" rx="20" ry="6"/>
  </g>
  <!-- gantry crane and crates -->
  <g fill="#2B2140">
    <rect x="600" y="70" width="190" height="12"/>
    <rect x="610" y="82" width="10" height="88"/>
    <rect x="770" y="82" width="10" height="88"/>
    <rect x="680" y="82" width="24" height="16"/>
    <rect x="690" y="98" width="4" height="36"/>
    <rect x="672" y="134" width="40" height="20"/>
    <rect x="630" y="146" width="44" height="24"/>
    <rect x="720" y="140" width="44" height="30"/>
  </g>
  <!-- curved-roof store -->
  <path d="M880 170 V118 Q980 70 1080 118 V170 Z" fill="#2B2140"/>
  <rect x="955" y="134" width="50" height="36" fill="url(#lit)"/>
  <!-- forklift -->
  <g fill="#1B1430">
    <rect x="1110" y="150" width="40" height="16" rx="3"/>
    <rect x="1120" y="136" width="22" height="16"/>
    <rect x="1152" y="130" width="4" height="36"/>
    <rect x="1156" y="150" width="20" height="14"/>
    <circle cx="1118" cy="167" r="5"/>
    <circle cx="1143" cy="167" r="5"/>
  </g>
  <!-- second sawtooth block -->
  <path d="M1220 170 V112 L1265 94 V112 L1310 94 V112 L1355 94 V112 L1400 94 V112 L1445 94 V112 L1490 94 V170 Z" fill="#2B2140"/>
  <g fill="url(#lit)">
    <rect x="1240" y="138" width="40" height="32"/>
    <rect x="1300" y="132" width="40" height="38"/>
    <rect x="1420" y="140" width="40" height="30"/>
  </g>
  <!-- light masts -->
  <g fill="#2B2140">
    <rect x="30" y="60" width="5" height="110"/>
    <rect x="560" y="66" width="5" height="104"/>
    <rect x="1550" y="62" width="5" height="108"/>
  </g>
  <g fill="#FFE4AA">
    <rect x="22" y="54" width="21" height="8" rx="2"/>
    <rect x="552" y="60" width="21" height="8" rx="2"/>
    <rect x="1542" y="56" width="21" height="8" rx="2"/>
  </g>
  <rect x="0" y="166" width="1600" height="4" fill="#2B2140"/>
</svg>
