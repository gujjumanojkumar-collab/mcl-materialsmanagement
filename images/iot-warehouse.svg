<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="IoT-linked stores: tagged spares on racks, a dumper and a drill send sensor data through a gateway and the cloud to the MM dashboard">
  <!-- Original drawing for the MM spares monitor. No photos, no real MCL material. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22324A"/>
      <stop offset="1" stop-color="#1A2433"/>
    </linearGradient>
  </defs>

  <!-- data links (dotted) -->
  <g fill="none" stroke="#6B9CF5" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round">
    <path d="M150 150 C200 110 260 96 330 92"/>
    <path d="M150 262 C220 220 280 150 334 112"/>
    <path d="M300 300 C320 230 330 170 344 118"/>
    <path d="M372 92 C420 80 450 72 492 74"/>
    <path d="M560 106 L560 168"/>
  </g>

  <!-- RACK with tagged spares -->
  <g fill="none" stroke="#A3ACB9" stroke-width="3">
    <line x1="30" y1="96" x2="30" y2="330"/>
    <line x1="170" y1="96" x2="170" y2="330"/>
    <line x1="30" y1="150" x2="170" y2="150"/>
    <line x1="30" y1="214" x2="170" y2="214"/>
    <line x1="30" y1="278" x2="170" y2="278"/>
  </g>
  <g fill="#2B3646" stroke="#A3ACB9" stroke-width="1.5">
    <rect x="40" y="116" width="44" height="34" rx="3"/>
    <rect x="92" y="124" width="36" height="26" rx="3"/>
    <rect x="40" y="184" width="30" height="30" rx="3"/>
    <rect x="78" y="176" width="52" height="38" rx="3"/>
    <rect x="40" y="244" width="56" height="34" rx="3"/>
    <rect x="104" y="250" width="40" height="28" rx="3"/>
  </g>
  <!-- tyre stack on the bottom shelf area -->
  <g fill="none" stroke="#A3ACB9" stroke-width="5">
    <ellipse cx="100" cy="318" rx="30" ry="9"/>
    <ellipse cx="100" cy="302" rx="30" ry="9"/>
  </g>
  <!-- RFID tags (orange) -->
  <g fill="#FF8A4C">
    <rect x="56" y="128" width="12" height="9" rx="2"/>
    <rect x="104" y="132" width="12" height="9" rx="2"/>
    <rect x="98" y="190" width="12" height="9" rx="2"/>
    <rect x="62" y="256" width="12" height="9" rx="2"/>
    <rect x="118" y="259" width="12" height="9" rx="2"/>
  </g>
  <!-- rack sensor node with signal arcs -->
  <circle cx="150" cy="150" r="8" fill="#34C3B1"/>
  <g fill="none" stroke="#34C3B1" stroke-width="2.5" stroke-linecap="round">
    <path d="M162 138 A17 17 0 0 1 162 162"/>
    <path d="M168 130 A28 28 0 0 1 168 170"/>
  </g>
  <circle cx="150" cy="262" r="8" fill="#34C3B1"/>

  <!-- DUMPER with telematics node -->
  <g fill="#2B3646" stroke="#A3ACB9" stroke-width="2">
    <path d="M206 300 L228 268 L330 268 L338 300 Z"/>
    <rect x="300" y="250" width="34" height="22" rx="3"/>
    <rect x="200" y="300" width="148" height="18" rx="4"/>
  </g>
  <g fill="#151A22" stroke="#A3ACB9" stroke-width="4">
    <circle cx="228" cy="330" r="15"/>
    <circle cx="318" cy="330" r="15"/>
  </g>
  <circle cx="300" cy="300" r="0" fill="none"/>
  <circle cx="318" cy="244" r="7" fill="#34C3B1"/>
  <g fill="none" stroke="#34C3B1" stroke-width="2.5" stroke-linecap="round">
    <path d="M308 232 A15 15 0 0 1 328 232"/>
    <path d="M302 224 A24 24 0 0 1 334 224"/>
  </g>

  <!-- DRILL mast (blast-hole drill) with node -->
  <g fill="#2B3646" stroke="#A3ACB9" stroke-width="2">
    <rect x="392" y="296" width="70" height="24" rx="3"/>
    <rect x="440" y="196" width="10" height="100"/>
    <rect x="398" y="276" width="30" height="20" rx="2"/>
  </g>
  <g fill="#151A22" stroke="#A3ACB9" stroke-width="3">
    <rect x="388" y="320" width="80" height="12" rx="6"/>
  </g>
  <circle cx="445" cy="188" r="7" fill="#34C3B1"/>
  <g fill="none" stroke="#6B9CF5" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round">
    <path d="M438 184 C410 150 380 130 356 118"/>
  </g>

  <!-- GATEWAY -->
  <g>
    <rect x="330" y="88" width="42" height="30" rx="6" fill="#2B3646" stroke="#6B9CF5" stroke-width="2.5"/>
    <line x1="340" y1="88" x2="334" y2="66" stroke="#6B9CF5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="362" y1="88" x2="368" y2="66" stroke="#6B9CF5" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="343" cy="103" r="3" fill="#34C3B1"/>
    <circle cx="353" cy="103" r="3" fill="#34C3B1"/>
    <circle cx="363" cy="103" r="3" fill="#FF8A4C"/>
  </g>

  <!-- CLOUD -->
  <path d="M500 106 C478 106 470 84 488 76 C486 54 516 46 528 62 C536 40 576 40 584 62 C604 56 622 72 614 90 C630 96 624 106 610 106 Z" fill="#2B3646" stroke="#6B9CF5" stroke-width="2.5"/>

  <!-- DASHBOARD SCREEN -->
  <rect x="474" y="168" width="214" height="140" rx="10" fill="url(#screen)" stroke="#A3ACB9" stroke-width="2.5"/>
  <rect x="546" y="308" width="70" height="12" fill="#A3ACB9"/>
  <rect x="520" y="320" width="122" height="8" rx="4" fill="#A3ACB9"/>
  <!-- bars -->
  <g>
    <rect x="494" y="246" width="16" height="44" rx="3" fill="#6B9CF5"/>
    <rect x="516" y="226" width="16" height="64" rx="3" fill="#6B9CF5"/>
    <rect x="538" y="262" width="16" height="28" rx="3" fill="#FF8A4C"/>
    <rect x="560" y="238" width="16" height="52" rx="3" fill="#6B9CF5"/>
  </g>
  <!-- gauge -->
  <path d="M604 266 A40 40 0 0 1 676 266" fill="none" stroke="#3A475A" stroke-width="10" stroke-linecap="round"/>
  <path d="M604 266 A40 40 0 0 1 656 232" fill="none" stroke="#34C3B1" stroke-width="10" stroke-linecap="round"/>
  <!-- alert chip -->
  <rect x="494" y="186" width="74" height="18" rx="9" fill="#FF8A4C"/>
  <rect x="580" y="190" width="90" height="10" rx="5" fill="#3A475A"/>
</svg>
